# ENG-3 -- Nenhuma maquina limpa nunca tinha tentado instalar este projeto.
# E exatamente por isso que o requirements.txt em UTF-16 (BUG-1) passou
# despercebido: na maquina de quem escreveu, ja estava tudo instalado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar (a partir do zero, como um clone novo)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint e formatacao
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tipos
        run: mypy

      - name: Testes
        run: pytest --cov=scrapingbot --cov-report=term-missing

      - name: Vulnerabilidades nas dependencias    # SEC-3
        run: pip-audit --strict --desc
        continue-on-error: true   # informa sem bloquear enquanto o baseline nao esta limpo

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t scrapingbot:ci .

      - name: A imagem sobe e responde?
        run: |
          docker run --rm \
            -e URL=https://exemplo.invalid/api \
            -e P_URL=https://exemplo.invalid \
            -e REFERER=https://exemplo.invalid \
            -e DISCORD_ALERT_WEBHOOK=https://discord.com/api/webhooks/1/x \
            -e DISCORD_LOG_WEBHOOK=https://discord.com/api/webhooks/2/y \
            scrapingbot:ci config

      - name: Varredura da imagem                  # SEC-3
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scrapingbot:ci
          severity: HIGH,CRITICAL
          exit-code: "0"   # reporta; nao bloqueia ate o baseline estar limpo
